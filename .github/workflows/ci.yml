name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  auth:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - name: CPU-only token checks
        run: |
          rustc --edition=2021 --test crates/omalight-protocol/src/auth.rs -o "$RUNNER_TEMP/auth-tests"
          "$RUNNER_TEMP/auth-tests" --test-threads=2

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      - name: wayland client libraries
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev libegl1-mesa-dev pkg-config
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
        env:
          CARGO_BUILD_JOBS: "2"
          LIGHTCRAFT_GPU: "0"
      - name: test
        run: LIGHTCRAFT_GPU=0 cargo test --workspace --locked
        env:
          CARGO_BUILD_JOBS: "2"

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - name: build
        run: cargo build --locked -p omalight
        env:
          CARGO_BUILD_JOBS: "2"
